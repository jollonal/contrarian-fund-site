name: nightly

on:
  schedule:
    - cron: "17 2 * * *"        # 02:17 UTC daily (04:17 CEST / 03:17 CET); GitHub may start it late
  workflow_dispatch:             # manual "Run workflow" button
  push:
    branches: [main]
    paths:
      - "site/**"                # edits to the main site deploy immediately
      - "scraper/overrides.yaml" # gloss corrections rebuild the page from cache, no AI calls

permissions:
  contents: write                # commit refreshed data back to the repo

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install
        run: |
          pip install -r scraper/requirements.txt
          if [ "${{ github.event_name }}" != "push" ]; then python -m playwright install --with-deps chromium; fi

      - name: Test
        working-directory: scraper
        run: python -m pytest -q

      - name: Scrape and build
        working-directory: scraper
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -m vernissage --no-fetch   # rebuild from cache only
          else
            python -m vernissage
          fi

      - name: Commit data
        continue-on-error: true      # a failed push must not block the deploy
        run: |
          git config user.name "vernissage-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scraper/state site/projects/vernissage
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh $(date -u +%F) (${{ github.event_name }})"
          for i in 1 2 3 4; do
            git push && exit 0
            echo "push failed (attempt $i), retrying"
            sleep $((i * 15))
            git pull --rebase -q origin main || true
          done
          exit 1

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=contrarian-fund --branch=main --commit-dirty=true
