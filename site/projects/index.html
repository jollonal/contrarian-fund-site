<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side projects</title>
<link rel="icon" href="/favicon.png">
<style>
  :root {
    --bg: #FAFAF7; --ink: #111111; --muted: #6B6B66; --rule: #DADAD4;
    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 var(--font); }
  a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 56px 24px 80px; }
  h1 { font-size: 32px; font-weight: 400; letter-spacing: -0.01em; margin: 0 0 40px; }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--ink); }
  li { padding: 24px 0; border-bottom: 1px solid var(--rule); }
  li h2 { font-size: 22px; font-weight: 400; margin: 0 0 4px; }
  li p { margin: 0; color: var(--muted); }
  footer { margin-top: 48px; font-size: 13px; color: var(--muted); }
  @media (max-width: 640px) { .wrap { padding: 32px 16px 56px; } h1 { font-size: 26px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Side projects</h1>
  <ul>
    <li>
      <h2><a href="/projects/vernissage/">Stockholm Vernissages</a></h2>
      <p>Exhibition openings at Stockholm galleries over the next 60 days. Scraped and updated nightly.</p>
    </li>
  </ul>
  <footer><a href="/">contrarian.fund</a></footer>
</div>
</body>
</html>
