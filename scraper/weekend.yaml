# Gallery Weekend page (hand-kept). Rendered to /projects/vernissage/gallery-weekend/ and
# linked from the main page from `announce_days` before `start` until `end`.
# Saving this file on GitHub rebuilds and redeploys the page in about two minutes, no AI.
#
# events: one entry per dated event. Fields:
#   date (YYYY-MM-DD), start and end (quoted "HH:MM"; leave out if not published),
#   venue (id from venues.yaml) or gallery (name, for galleries not in venues.yaml),
#   address / district / site (override or supply), kind (Opening, Reception, Talk,
#   Tour, Performance, Presentation, Preview), title, artists, note.
# on_view: shows open all weekend with no event listed; same place fields.
# For a new year, replace the dates, hours, events and on_view lists.

