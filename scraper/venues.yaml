# Stockholm venue registry. Hand-curated. Verified 2026-10-07; artist-run spaces added 2026-10-08.
#
# adapter:
#   artlogic   Artlogic CMS. Fetch /exhibitions/current/ and /exhibitions/forthcoming/.
#   wordpress  WordPress. Try /feed/ first, fall back to HTML.
#   squarespace, shopify, static  Fetch HTML, LLM extraction.
#   headless   Needs Playwright to render before extraction.
# status: active | paused | excluded
# opening_text: does the site publish vernissage times in HTML (yes/no)
# mail_domains: sender domains for newsletters when they differ from the website's.
#   Newsletters are matched to every venue except excluded ones; newsletter: true
#   keeps an excluded venue (e.g. one that blocks scrapers) in the newsletter reader.

